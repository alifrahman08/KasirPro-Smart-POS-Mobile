name: kasirpro
description: "KasirPro — Smart POS Mobile: Aplikasi Manajemen Stok, Kasir, dan Keuangan UMKM"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management & Routing
  get: ^4.7.2

  # Backend & Network
  supabase_flutter: ^2.8.4
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.3

  # Local Database & Storage (Drift SQLite & Preferences)
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.2

  # Hardware: Barcode & Bluetooth Thermal Printer
  mobile_scanner: ^6.0.4
  flutter_blue_plus: ^1.35.4

  # Documents & Printing
  pdf: ^3.11.2
  printing: ^5.13.4

  # Visualizations & Charts
  fl_chart: ^0.70.2

  # Notifications & Media
  flutter_local_notifications: ^18.0.1
  image_picker: ^1.1.2

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  csv: ^6.0.0
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15

dependency_overrides:
  archive: ^4.0.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/demo/
