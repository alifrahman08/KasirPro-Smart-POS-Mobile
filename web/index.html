<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="KasirPro — Smart POS Mobile UMKM">

  <!-- iOS PWA meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="KasirPro">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <link rel="apple-touch-icon-precomposed" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>KasirPro — Smart POS Mobile</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1E5E3A;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: white;
      -webkit-user-select: none;
      user-select: none;
    }
    .splash-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .splash-logo {
      width: 100px;
      height: 100px;
      border-radius: 22px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      margin-bottom: 16px;
    }
    .splash-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .splash-subtitle {
      font-size: 13px;
      opacity: 0.8;
      margin-bottom: 24px;
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="splash-container" id="splash">
    <img src="icons/Icon-192.png" alt="KasirPro Logo" class="splash-logo">
    <div class="splash-title">KasirPro</div>
    <div class="splash-subtitle">Smart POS Mobile UMKM</div>
    <div class="spinner"></div>
    <div id="loading-tip" style="margin-top: 16px; font-size: 11px; opacity: 0.7;">Memuat sistem KasirPro...</div>
    <div id="error-box" style="display:none; margin-top: 14px; font-size: 12px; background: rgba(0,0,0,0.3); padding: 8px 14px; border-radius: 8px;">
      <span id="error-text"></span>
      <br>
      <button onclick="location.reload()" style="margin-top: 8px; background: #fff; color: #1E5E3A; border: none; padding: 6px 14px; border-radius: 6px; font-weight: bold; cursor: pointer;">Muat Ulang</button>
    </div>
  </div>
  <script>
    window.addEventListener('error', function(e) {
      var box = document.getElementById('error-box');
      var txt = document.getElementById('error-text');
      if (box && txt) {
        box.style.display = 'block';
        txt.innerText = 'Koneksi terputus atau gagal memuat.';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
